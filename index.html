<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QReview — Review Anything</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0D0D0F; color: #F0F0EC; }
    .hero { background: linear-gradient(135deg, #0D0D0F 0%, #1A0A40 50%, #0D0D0F 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
    .icon { width: 100px; height: 100px; border-radius: 24px; background: linear-gradient(135deg, #1C1C1A, #2A2A28); border: 2px solid #6C47FF; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 52px; box-shadow: 0 0 40px rgba(108,71,255,0.3); }
    h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; }
    h1 span { color: #00C896; }
    p { color: #9A9A96; font-size: 16px; max-width: 480px; line-height: 1.6; margin-bottom: 32px; }
    .badges { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 48px; }
    .badge { background: #1C1C1A; border: 0.5px solid #2A2A28; border-radius: 20px; padding: 8px 18px; font-size: 13px; color: #9A9A96; }
    .badge strong { color: #F0F0EC; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .links a { color: #6C47FF; font-size: 14px; text-decoration: none; padding: 10px 20px; border: 1px solid rgba(108,71,255,0.3); border-radius: 10px; }
    .links a:hover { background: rgba(108,71,255,0.1); }
    .coming { display: inline-block; background: rgba(0,200,150,0.12); color: #00C896; border: 1px solid rgba(0,200,150,0.3); border-radius: 20px; padding: 6px 16px; font-size: 12px; font-weight: 700; margin-bottom: 20px; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="icon">Q</div>
    <span class="coming">COMING SOON TO APP STORES</span>
    <h1>Q<span>Review</span></h1>
    <p>Review anything. Businesses, people, places, products — and the workers, trades and services you actually use.</p>
    <div class="badges">
      <div class="badge">⭐ <strong>Reviews & Ratings</strong></div>
      <div class="badge">📱 <strong>QR Codes</strong></div>
      <div class="badge">🏢 <strong>Business Tools</strong></div>
      <div class="badge">👷 <strong>QR Resumes</strong></div>
      <div class="badge">🤝 <strong>Trusted Associates</strong></div>
    </div>
    <div class="links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
      <a href="mailto:support@qreviewit.app">Contact Us</a>
    </div>
  </div>
</body>
</html>
